<style>
:root {
  /* Sky and gold: pale sky pages, deep navy ink, royal blue and burnished gold accents. Light only, whatever the system setting. */
  --bg: #dbe9f4;
  --surface: #f4f9fd;
  --raised: #ffffff;
  --ink: #142a4c;
  --muted: #4b6584;
  --line: #bcd2e6;
  --gold: #b8862a;
  --gilt: #e0b44a;
  --royal: #1d4f91;
  --royal-2: #2f6fbf;
  --accent: #1f5ca8;
  --accent-ink: #ffffff;
  --accent-soft: #fbefc8;
  --active: #fff4d3;
  --good: #2e7a3a;
  --warn: #a06200;
  --bad: #b02a1f;
  --pc: #1f5ca8;
  --npc: #6a3f9a;
  --mon: #a3301f;
  --r-common: #5f6b7c;
  --r-uncommon: #2e7a3a;
  --r-rare: #1f5ca8;
  --r-veryrare: #7038a0;
  --r-legendary: #b4600a;
  --r-artifact: #b02a1f;
  --display: "Cinzel", "Trajan Pro", "Palatino Linotype", Palatino, Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --book: "Alegreya", "Palatino Linotype", Palatino, Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; padding-bottom: env(safe-area-inset-bottom); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.02rem; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: .86rem; } .tiny { font-size: .76rem; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 96px; }
.wrap.wide { max-width: 1200px; }
header.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding: calc(env(safe-area-inset-top) + 8px) 16px 8px; }
header.top .in { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 40px; }
header.top .title { flex: 1; min-width: 0; }
header.top .title h1 { font-size: 1.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.top .title .sub { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; }
.card > h2:first-child, .card > h3:first-child { margin-bottom: 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.nw { flex-wrap: nowrap; } .grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 8px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 14px; min-height: 40px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: .9rem; }
.btn.icon { width: 40px; padding: 0; display: inline-grid; place-items: center; font-size: 1.3rem; line-height: 1; }
header .btn.icon { font-size: 1.7rem; }
.btn:disabled { opacity: .45; cursor: default; }
input[type=text], input[type=number], input:not([type]), select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 40px; width: 100%; }
textarea { min-height: 90px; resize: vertical; }
label.f { display: block; } label.f > span { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 3px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); font-size: .8rem; }
.pill.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.src { font-size: .68rem; font-weight: 600; padding: 0 5px; border-radius: 4px; background: var(--accent-soft); color: var(--muted); vertical-align: 1px; }
.pill.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin: 12px -16px 0; padding: 0 16px; position: sticky; top: calc(env(safe-area-inset-top) + 57px); background: var(--bg); z-index: 10; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; padding: 10px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.stat { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px; text-align: center; }
.stat .v { font-family: var(--mono); font-size: 1.35rem; font-weight: 600; }
.stat .k { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.abils { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.abil { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; }
.abil .n { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.abil .m { font-family: var(--mono); font-size: 1.4rem; font-weight: 600; }
.abil .s { font-family: var(--mono); font-size: .82rem; color: var(--muted); }
.abil .sv { margin-top: 4px; font-size: .78rem; border-top: 1px solid var(--line); padding-top: 4px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); vertical-align: middle; }
.dot.on { background: var(--accent); border-color: var(--accent); }
.dot.ex { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 2px var(--raised), 0 0 0 3.5px var(--accent); }
.list > .li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.list > .li:first-child { border-top: 0; }
.skill .mod { font-family: var(--mono); width: 3.2em; text-align: right; }
.hpbar { height: 8px; border-radius: 6px; background: var(--line); overflow: hidden; display: flex; }
.hpbar i { display: block; background: var(--good); } .hpbar i.t { background: var(--pc); }
.hpbar.low i:first-child { background: var(--warn); } .hpbar.crit i:first-child { background: var(--bad); }
.hpbig { font-family: var(--mono); font-size: 2rem; font-weight: 600; }
.pips { display: inline-flex; gap: 5px; flex-wrap: wrap; }
.pip { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--accent); background: var(--accent); cursor: pointer; padding: 0; }
.pip.used { background: transparent; border-color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: .9rem; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip:disabled { opacity: .4; cursor: default; }
.feat { padding: 10px 0; border-top: 1px solid var(--line); }
.feat:first-of-type { border-top: 0; }
.feat .h { display: flex; gap: 8px; align-items: baseline; }
.feat .h b { flex: 1; }
.feat p { margin: 4px 0 0; font-size: .93rem; color: var(--muted); white-space: pre-wrap; }
.rar { font-size: .78rem; font-weight: 600; text-transform: capitalize; }
.rar.common { color: var(--r-common); } .rar.uncommon { color: var(--r-uncommon); } .rar.rare { color: var(--r-rare); } .rar.veryrare { color: var(--r-veryrare); } .rar.legendary { color: var(--r-legendary); } .rar.artifact { color: var(--r-artifact); }
.inbox { border: 1.5px solid var(--accent); background: var(--active); }
.grant { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.grant:first-of-type { border-top: 0; }
.steps { display: flex; gap: 4px; margin: 12px 0 4px; }
.steps i { flex: 1; height: 4px; border-radius: 3px; background: var(--line); } .steps i.on { background: var(--accent); }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pick button { text-align: left; border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 10px; cursor: pointer; min-height: 64px; }
.pick button.on { border-color: var(--accent); background: var(--active); box-shadow: inset 0 0 0 1px var(--accent); }
.pick button b { display: block; font-family: var(--display); }
.pick button span { font-size: .8rem; color: var(--muted); }
.chooser { margin-top: 10px; }
.chooser select { font-family: var(--display); font-weight: 700; font-size: 1.05rem; min-height: 48px; border: 1.5px solid var(--gold); background-color: var(--raised); }
.pv { border: 1.5px solid var(--gilt); background: linear-gradient(var(--active), var(--raised) 140px); }
.pv .pvh { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pv .pvh h3 { color: var(--royal); font-size: 1.25rem; }
.pv .facts { margin: 10px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.pv .facts div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.pv .facts dt { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.pv .facts dd { margin: 0; font-size: .9rem; font-weight: 600; }
.pv h4 { font-family: var(--display); color: var(--royal); margin: 12px 0 4px; font-size: .95rem; border-bottom: 1px solid var(--gilt); padding-bottom: 2px; }
.pv .ft { font-size: .88rem; margin: 4px 0; }
.pv .ft .lv { display: inline-block; min-width: 2.6em; font-size: .7rem; font-weight: 700; color: var(--gold); }
.pv details.sub { margin-left: 4px; padding-left: 10px; border-left: 2px solid var(--gilt); }
.pv details.sub summary { color: var(--ink); font-weight: 400; margin-top: 6px; }
.pv details summary { cursor: pointer; color: var(--royal); font-weight: 600; font-size: .88rem; margin-top: 8px; }
.party { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.pc { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; text-align: left; width: 100%; }
.pc:hover { border-color: var(--accent); }
.pc .nm { font-family: var(--display); font-weight: 700; font-size: 1.1rem; }
.pc .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; text-align: center; }
.pc .meta div { background: var(--surface); border-radius: 8px; padding: 4px; }
.pc .meta b { display: block; font-family: var(--mono); }
.pc .meta span { font-size: .7rem; color: var(--muted); text-transform: uppercase; }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: 0 0 0 0 transparent; } }
.code { font-family: var(--mono); font-size: 1.6rem; letter-spacing: .2em; font-weight: 600; color: var(--accent); }
.banner { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; font-size: .88rem; margin-top: 12px; }
.quota { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.quota > div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.quota .k { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.quota .v { font-family: var(--mono); font-size: 1.25rem; font-weight: 600; color: var(--royal); }
.quota .v small { font-size: .8rem; color: var(--muted); font-weight: 400; }
.quota .st { font-size: .76rem; color: var(--muted); }
.quota .full { border-color: var(--good); } .quota .full .st { color: var(--good); }
.quota .over { border-color: var(--bad); } .quota .over .st, .quota .over .v { color: var(--bad); }
.qline { display: flex; flex-wrap: wrap; gap: 6px; }
.qc { font-size: .85rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.qc.full { border-color: var(--good); color: var(--good); } .qc.over { border-color: var(--bad); color: var(--bad); }
.lvbar { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; scrollbar-width: thin; }
.lvbar button { flex: 0 0 auto; min-width: 74px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; cursor: pointer; text-align: center; }
.lvbar button b { display: block; font-family: var(--display); color: var(--royal); font-size: .95rem; }
.lvbar button span { display: block; font-size: .72rem; color: var(--muted); white-space: nowrap; }
.lvbar button.on { background: linear-gradient(var(--royal-2), var(--royal)); border-color: var(--gold); }
.lvbar button.on b, .lvbar button.on span { color: #fff; }
.lvhead { margin-top: 8px; padding: 8px 12px; border-radius: 10px; background: var(--active); border: 1px solid var(--gilt); font-size: .88rem; }
.lvhead .good { color: var(--good); } .lvhead .bad { color: var(--bad); }
.sprows { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--raised); }
.sprows > .sp:first-child, .sprows > .sp[hidden] + .sp { border-top: 0; }
.sp { border-top: 1px solid var(--line); }
.sp > summary { display: flex; align-items: center; gap: 8px; padding: 8px 0; cursor: pointer; list-style: none; }
.sp > summary::-webkit-details-marker { display: none; }
.sp > summary .nm { font-family: var(--book); font-weight: 700; font-size: 1.02rem; }
.sp[open] > summary .nm { color: var(--royal); }
.sp .body { padding: 0 0 12px; }
.sp .body p { margin: 8px 0 0; font-family: var(--book); white-space: pre-wrap; }
.spfacts { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; margin: 0; }
.spfacts div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
.spfacts dt { font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.spfacts dd { margin: 0; font-size: .88rem; font-weight: 600; }
.tag { display: inline-block; font-size: .66rem; font-weight: 700; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); vertical-align: 1px; }
.btn.added { color: var(--good); border-color: var(--good); }
.ifs { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 12px; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ifs[hidden] { display: none; }
.ifs legend { font-family: var(--display); color: var(--royal); padding: 0 6px; font-size: .95rem; }
.abgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
@media (max-width: 420px) { .abgrid { grid-template-columns: repeat(3, 1fr); } }
.f[hidden] { display: none; }
.coinbar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.coinbar input { flex: 1 1 110px; min-width: 0; } .coinbar select { flex: 0 0 76px; }
.coinbtns { flex: 1 1 210px; display: flex; gap: 6px; } .coinbtns .btn { flex: 1; }
.qty { display: inline-flex; align-items: center; gap: 2px; }
.qty .btn.sm { min-height: 28px; padding: 0 8px; }
.qty .num { min-width: 1.6em; text-align: center; }
dialog.wide { width: min(780px, calc(100vw - 24px)); }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--raised); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); }
dialog::backdrop { background: rgb(0 0 0 / .5); }
dialog .dh { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--raised); z-index: 1; }
dialog .dh h2 { flex: 1; }
dialog .db { padding: 14px; }
dialog .df { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 14px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--raised); }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 100; max-width: calc(100vw - 32px); opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.on { opacity: 1; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.sec-title { display: flex; align-items: center; gap: 8px; margin: 20px 0 4px; }
.sec-title h2 { flex: 1; }
.recap p { margin: 6px 0; } .recap ul { margin: 6px 0; padding-left: 20px; } .recap h4 { margin: 10px 0 4px; }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, 1fr); } .grid3 { grid-template-columns: 1fr 1fr; } }

/* ---- sky and gold theme ---- */
body { background-color: var(--bg); background-image: radial-gradient(ellipse 60% 40% at 15% 8%, rgb(255 255 255 / .65), transparent 70%), radial-gradient(ellipse 50% 35% at 85% 20%, rgb(255 255 255 / .5), transparent 70%), radial-gradient(ellipse 120% 60% at 50% 110%, rgb(224 180 74 / .18), transparent 70%), linear-gradient(#cfe3f3, #e8f2fa 55%, #eef3ef); background-attachment: fixed; }
h1, h2, h3 { font-weight: 600; letter-spacing: .03em; }
::selection { background: #f6dc8e; color: var(--ink); }
:root { accent-color: var(--accent); }
.btn.primary { background: linear-gradient(var(--royal-2), var(--royal)); border-color: var(--gold); color: #fff; box-shadow: inset 0 1px 0 rgb(255 255 255 / .25), 0 1px 3px rgb(20 42 76 / .3); text-shadow: 0 1px 0 rgb(0 0 0 / .25); }
.btn.primary:hover { filter: brightness(1.1); }
a.btn { color: var(--ink); }
.toast, #toast { background: #142a4c; color: #fff; border: 1px solid var(--gilt); }
.toast .btn { color: #fff; border-color: #fff; }
dialog::backdrop { background: rgb(10 30 60 / .45); }
input[type=text], input[type=number], input:not([type]), select, textarea { box-shadow: inset 0 1px 2px rgb(20 42 76 / .07); }
input:focus, select:focus, textarea:focus { border-color: var(--gilt); outline: none; box-shadow: 0 0 0 3px rgb(224 180 74 / .35); }

header.top { --ink: #ffffff; --muted: #cfe0f4; --line: rgb(255 255 255 / .28); --raised: rgb(255 255 255 / .14); --surface: rgb(255 255 255 / .1); --bg: rgb(10 30 70 / .25); --accent: var(--gilt); --accent-ink: #142a4c; color: #fff; background: linear-gradient(#2a68b6, #1b4a8a); border-bottom: 3px solid var(--gilt); box-shadow: 0 1px 0 #8a6418, 0 4px 14px rgb(20 42 76 / .25); }
header.top .title h1 { color: #fff; text-shadow: 0 1px 0 rgb(0 0 0 / .25); }
header.top .btn.primary { background: linear-gradient(#ffe7a0, #e0b44a); color: #142a4c; border-color: #8a6418; text-shadow: none; }
.card, .stat, .pc { border-color: #bcd2e6; box-shadow: 0 2px 12px rgb(29 79 145 / .09); }
.card { outline: 1px solid rgb(184 134 42 / .35); outline-offset: -5px; }
.card > h2:first-child, .card > h3:first-child, .sec-title h2, .card .row > h2 { color: var(--royal); }
.tabs { background: rgb(219 233 244 / .92); backdrop-filter: blur(4px); }
.tabs button { font-family: var(--display); letter-spacing: .04em; }
.tabs button.on { color: var(--royal); border-bottom: 3px solid var(--gilt); }
.stat .v, .abil .m, .hpbig { color: var(--royal); }
.abil { background: linear-gradient(#ffffff, #eaf3fb); }
.pc .nm, .pick button b { color: var(--royal); }
.pill { background: #fbefc8; }
.banner { background: #e3eefa; border: 1px solid #c6d9ea; }
.inbox { border-color: var(--gilt); }
.dot.on, .dot.ex, .pip { }
.feat p { font-family: var(--book); font-size: 1rem; }
.feat .h b { font-family: var(--book); font-size: 1.05rem; }
.code { color: var(--royal); }

<script>

// ---------- boot ----------

}

async function addBooks(files) {

// How many of each catalog item the character has: the Add buttons show it.
function refreshGear() {
  const r = charRow(A.charId), dlg = $("#dlg"); if (!r || !$("#gBody", dlg)) return;
  const inv = r.data.inventory;
  dlg.querySelectorAll("[data-gbtn]").forEach(el => {
    const e = GCAT[+el.dataset.gbtn], n = inv.filter(o => o.name.toLowerCase() === e.item.name.toLowerCase()).reduce((s, o) => s + (o.qty == null ? 1 : +o.qty), 0);
    el.innerHTML = n ? `<button class="btn sm added" data-a="gadd" data-i="${el.dataset.gbtn}" title="Add another">✓ ${n} · Add</button>` : `<button class="btn sm" data-a="gadd" data-i="${el.dataset.gbtn}">Add</button>`;
  });

function filterGear(q) {
  q = (q ?? (($("#gQ") || {}).value || "")).trim().toLowerCase();
  let n = 0;
  $("#dlg").querySelectorAll("#gBody .sp").forEach(el => {
    const ok = q ? el.dataset.s.includes(q) : el.dataset.c === GP.cat && (!GP.sub || el.dataset.sub === GP.sub) && (GP.cat !== "magic" || !GP.rar || el.dataset.r === GP.rar);
    el.hidden = !ok; if (ok) n++;

}
// Put an item in the pack. Plain gear stacks with what's already there; weapons and armor go on equipped.
function addToPack(d, src) {
  const it = Object.assign({ qty: 1 }, JSON.parse(JSON.stringify(src)), { id: E.uid(), equipped: false, attuned: false });
  const plain = o => !o.weapon && !o.armor && !o.attune && !o.charges && !o.abil && !o.acBonus && !o.fromDM;
  const stack = plain(it) && d.inventory.find(o => plain(o) && o.name === it.name && (o.type || "") === (it.type || "") && (o.desc || "") === (it.desc || ""));
  if (stack) { stack.qty = (stack.qty == null ? 1 : +stack.qty) + (+it.qty || 1); return stack; }
  if (it.weapon) it.equipped = true;
  if (it.armor) { it.equipped = true; d.inventory.forEach(o => { if (o.armor && (o.armor.cat === "Shield") === (it.armor.cat === "Shield")) o.equipped = false; }); }
  d.inventory.push(it); return it;
}

function readItem(base = {}) {
  const q = val("iQty");
  Object.assign(base, { name: val("iName") || "Unnamed item", type: val("iType"), rarity: val("iRarity"), qty: q === "" ? 1 : Math.max(0, Math.floor(+q || 0)),
    weight: Math.max(0, +val("iWt") || 0), cost: val("iCost"), acBonus: +val("iAc") || 0, charges: Math.max(0, Math.floor(+val("iCh") || 0)),
    attune: val("iAttune"), attuneBy: val("iAttune") ? val("iAttBy").replace(/^by\s+/i, "") : "", desc: val("iDesc") });
  if (val("iHasW")) { base.weapon = { dmg: val("iDmg") || "1d4", type: val("iDType"), props: val("iProps"), mastery: val("iMast"), cat: val("iWCat") }; base.bonus = +val("iBonus") || 0; if (val("iProf")) delete base.proficient; else base.proficient = false; }
  else { delete base.weapon; delete base.proficient; base.bonus = 0; }
  if (val("iHasA")) { const c = val("iCap"); base.armor = { cat: val("iACat"), base: +val("iBase") || 0, cap: c === "full" ? null : +c, stealth: val("iStealth"), str: +val("iStr") || 0 }; }
  else delete base.armor;
  const ab = {}; ABILS.forEach(k => { const v = Math.floor(+val("iAb_" + k) || 0); if (v) ab[k] = v; });
  if (Object.keys(ab).length) base.abil = ab; else delete base.abil;
  return base;
}
// A generic magic item named for its base: "Weapon, +1" + Rapier = "+1 Rapier", "Armor of Resistance" + Chain Mail = "Chain Mail of Resistance".
function baseName(cur, base) {
  cur = cur.trim(); if (!cur) return base;
  const m = /^(?:weapon|armor)(?:,\s*(\+\d)\b.*|(\s+of\b.*)?)$/i.exec(cur);
  return !m ? cur : m[1] ? `${m[1]} ${base}` : base + (m[2] || "");
}
// Put what the editor read onto an item on the sheet, dropping stat blocks the editor turned off.
function applyItem(it, form) {
  ["weapon", "armor", "abil", "proficient"].forEach(k => delete it[k]);
  Object.assign(it, JSON.parse(JSON.stringify(form)));
  if (!it.attune) it.attuned = false;
  if (!it.charges) delete it.chargesUsed; else if (it.chargesUsed > it.charges) it.chargesUsed = it.charges;
  return it;
}
// o: { id } to edit an item on the sheet, { back: true } to return to the gear picker after.

function invRow(i) {

function tGear(r, d, x) {

// ---------- session notes (players) ----------
function noteTime(t) { const d = new Date(t); return isNaN(d) ? "" : d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); }
function sessLabel(x) { return `${x.title || "Session"}${x.played_on ? " · " + new Date(x.played_on + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" }) : ""}${x.live ? " · playing now" : ""}`; }
// Recaps come from the DM Suite as Markdown with [[Lore links]]: show headings, bullets, bold and italics, drop the links' brackets.
function miniMd(t) {
  const inl = x => esc(x.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, a, b) => b || a)).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  let out = "", list = false;
  for (const raw of String(t || "").replace(/\r/g, "").split("\n")) {
    const l = raw.trim(), li = l.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/), h = l.match(/^#{1,6}\s+(.*)$/);
    if (li) { if (!list) { out += "<ul>"; list = true; } out += `<li>${inl(li[1])}</li>`; continue; }
    if (list) { out += "</ul>"; list = false; }
    if (h) out += `<h4>${inl(h[1])}</h4>`; else if (l) out += `<p>${inl(l)}</p>`;
  }
  return out + (list ? "</ul>" : "");
}
function noteRow(n, x, other) {

async function importSuiteLibrary() {
  const items = (await A.be.suiteItems()).filter(x => x && x.name);
  if (!items.length) return toast("Your item library is empty. Save magic items on the Table tab first.");
  const have = new Set(A.homebrew.filter(h => h.kind === "item").map(h => h.data.name));
  let n = 0;
  for (const x of items) { const it = E.fromSuiteItem(x); if (have.has(it.name)) continue; await A.be.saveHomebrew(A.camp.id, "item", it); have.add(it.name); n++; }
  A.homebrew = await A.be.listHomebrew(A.camp.id); render();
  toast(n ? `Imported ${n} item${n > 1 ? "s" : ""}` : "Those items are already in your library");
}
async function importSuite(file) {
  const text = await file.text();
  let j; try { j = JSON.parse(text); } catch (e) { throw new Error("That file isn't a DM Suite campaign or JSON export."); }
  let items = [];
  if (j.format === "ebon-dm-campaign") { items = Object.values(j.items || {}); if (j.table && Array.isArray(j.table.library)) items = items.concat(j.table.library); }
  else if (Array.isArray(j)) items = j; else if (j.items) items = Array.isArray(j.items) ? j.items : Object.values(j.items); else if (j.library) items = j.library;
  items = items.filter(x => x && x.name);
  if (!items.length) throw new Error("No magic items found in that file. Save some in the DM Suite's item library first.");
  const have = new Set(A.homebrew.filter(h => h.kind === "item").map(h => h.data.name));
  let n = 0;
  for (const x of items) { const it = E.fromSuiteItem(x); if (have.has(it.name)) continue; await A.be.saveHomebrew(A.camp.id, "item", it); n++; }
  A.homebrew = await A.be.listHomebrew(A.camp.id); render();
  toast(n ? `Imported ${n} item${n > 1 ? "s" : ""}` : "Those items are already in your library");
}

// ---------- rolling from the sheet ----------
// Anything with data-a="roll" rolls when tapped. Hold it (or right-click) for advantage, disadvantage, a critical hit,
// two-handed damage, and the dice color. data-r says what it is: abil/save/skill (data-k), init, atk/dmg (data-i), spatk, death.
const ROLL = { last: null, menu: null, press: null };
const rollAttr = (r, k, label) => `data-a="roll" data-r="${r}"${k != null ? ` data-k="${esc(k)}"` : ""} role="button" tabindex="0" title="Roll ${esc(label)} (hold for advantage and more)"`;
function parseDice(s) {
  const groups = [], str = String(s || "");
  str.replace(/(\d*)d(\d+)/gi, (m, n, sd) => { groups.push([Math.max(1, +n || 1), +sd]); return ""; });
  const mod = (str.replace(/\d*d\d+/gi, "").match(/[+-]\s*\d+/g) || []).reduce((t, m) => t + +m.replace(/\s/g, ""), 0);
  return { groups, mod, type: (str.match(/[a-z]{3,}/i) || [""])[0] };
}
// What a roll element means for this character, right now.
function rollSpec(el, opt = {}) {
  const r = charRow(A.charId); if (!r) return null;
  const d = r.data, x = E.derive(d), kind = el.dataset.r, k = el.dataset.k, pen = x.d20Penalty ? [["Exhaustion", -x.d20Penalty]] : [];
  const who = d.name || "Character";
  if (kind === "abil") return { who, title: ABIL_NAME[k] + " check", d20: true, parts: [[ABIL_NAME[k], x.mods[k]], ...pen] };
  if (kind === "save") return { who, title: ABIL_NAME[k] + " save", d20: true, parts: [[ABIL_NAME[k] + " save", x.saves[k].mod], ...pen] };
  if (kind === "skill") { const s = x.skills[k]; return s && { who, title: k, sub: ABIL_NAME[s.abil] + " check", d20: true, parts: [[k, s.mod], ...pen] }; }
  if (kind === "init") return { who, title: "Initiative", d20: true, parts: [["Initiative", x.init], ...pen] };
  if (kind === "spatk") return x.spell && { who, title: "Spell attack", d20: true, attack: true, parts: [["Spell attack", x.spell.atk], ...pen] };
  if (kind === "death") return { who, title: "Death save", d20: true, death: true, parts: pen };
  const a = x.attacks[+k]; if (!a) return null;
  if (kind === "atk") return { who, title: a.name, sub: "Attack roll", d20: true, attack: +k, parts: [["To hit", a.hit], ...pen] };
  if (kind === "dmg") {
    const two = opt.versatile && (String(a.props || "").match(/versatile\s*\((\d*d\d+)\)/i) || [])[1];
    const p = parseDice(two ? a.dmg.replace(/\d*d\d+/i, two) : a.dmg);
    if (!p.groups.length) return null;
    const crit = !!opt.crit;
    return { who, title: a.name, sub: (crit ? "Critical hit" : "Damage") + (two ? ", two-handed" : "") + (p.type ? " · " + p.type : ""), groups: p.groups.map(([n, sd]) => [crit ? n * 2 : n, sd]), parts: p.mod ? [["Damage", p.mod]] : [] };
  }

}
async function doRoll(spec, mode = "") {
  if (!spec) return;
  closeRollMenu();
  const card = $("#rollCard"); card.classList.remove("on");
  const list = spec.d20 ? (mode ? [20, 20] : [20]) : spec.groups.flatMap(([n, sd]) => Array(n).fill(sd));
  const charId = A.charId, token = {}; ROLL.last = token;
  const vals = await Dice.roll(list, { bottom: Math.min(200, innerHeight * 0.3) });
  if (ROLL.last !== token) return; // a newer roll took over
  const mod = spec.parts.reduce((t, p) => t + p[1], 0);
  let kept = null, total, chips;
  if (spec.d20) {
    kept = mode === "adv" ? Math.max(...vals) : mode === "dis" ? Math.min(...vals) : vals[0];
    const drop = mode ? vals.indexOf(kept) === 0 ? 1 : 0 : -1;
    total = kept + mod;
    chips = vals.map((v, i) => `<span class="rdie${i === drop ? " drop" : ""}${v === 20 && i !== drop ? " nat20" : v === 1 && i !== drop ? " nat1" : ""}"><b>${v}</b><i>d20</i></span>`).join("");
  } else {
    total = Math.max(0, vals.reduce((t, v) => t + v, 0) + mod);
    chips = vals.map((v, i) => `<span class="rdie"><b>${v}</b><i>d${list[i]}</i></span>`).join("");
  }
  const mods = spec.parts.filter(p => p[1]).map(p => `<span class="rmod" title="${esc(p[0])}">${p[1] < 0 ? "−" : "+"} ${Math.abs(p[1])}</span>`).join("");
  let note = "", acts = "";
  if (spec.d20 && kept === 20) note = `<div class="rnote good">Natural 20!</div>`;
  if (spec.d20 && kept === 1) note = `<div class="rnote bad">Natural 1</div>`;
  if (spec.death) {
    let msg = "";
    edit(charId, d => {
      const ds = d.deathSaves = d.deathSaves || { s: 0, f: 0 };
      if (kept === 20) { d.hp.cur = 1; d.deathSaves = { s: 0, f: 0 }; msg = "You regain 1 hit point and get back up."; }
      else if (kept === 1) { ds.f = Math.min(3, ds.f + 2); msg = `Two failures (${ds.f} of 3).`; }
      else if (total >= 10) { ds.s = Math.min(3, ds.s + 1); msg = ds.s >= 3 ? "Three successes: you're stable." : `Success (${ds.s} of 3).`; }
      else { ds.f = Math.min(3, ds.f + 1); msg = `Failure (${ds.f} of 3).`; }
      if (ds.f >= 3 && kept !== 20) msg = "Three failures.";
    });
    note = `<div class="rnote ${kept === 20 || total >= 10 ? "good" : "bad"}">${esc(msg)} Marked on your sheet.</div>`;
  }
  if (typeof spec.attack === "number") {
    const dm = rollSpec({ dataset: { r: "dmg", k: String(spec.attack) } });
    if (dm) acts = `<div class="row" style="margin-top:8px">${kept === 20 ? `<button class="btn sm primary" data-a="rolldmg" data-k="${spec.attack}" data-crit="1">Roll critical damage</button>` : ""}<button class="btn sm${kept === 20 ? "" : " primary"}" data-a="rolldmg" data-k="${spec.attack}">Roll damage</button></div>`;
  }
  card.innerHTML = `<div class="row nw"><div class="grow"><div class="rt">${esc(spec.title)}</div><div class="tiny muted">${esc([spec.sub, mode === "adv" ? "Advantage" : mode === "dis" ? "Disadvantage" : "", spec.who].filter(Boolean).join(" · "))}</div></div>
    <div class="rtotal">${total}</div><button class="btn sm icon ghost" data-a="rollclose" aria-label="Close">×</button></div>
    <div class="rline">${chips}${mods}<span class="req">= ${total}</span></div>${note}${acts}`;
  card.classList.add("on");
  clearTimeout(ROLL.hide); ROLL.hide = setTimeout(() => card.classList.remove("on"), 12000);
}
function closeRollMenu() { if (ROLL.menu) { ROLL.menu.remove(); ROLL.menu = null; } }
function rollMenu(el) {

  const m = document.createElement("div"); m.className = "rmenu"; m.setAttribute("role", "menu");
  const r = charRow(A.charId), a = el.dataset.r === "dmg" && r ? E.derive(r.data).attacks[+el.dataset.k] : null;
  const vers = a && /versatile\s*\(\d*d\d+\)/i.test(a.props || "");
  const items = spec.d20 ? [["", "Roll"], ["adv", "Roll with advantage"], ["dis", "Roll with disadvantage"]] : [["", "Roll damage"], ["crit", "Critical hit (double dice)"], ...(vers ? [["vers", "Two-handed"], ["vers crit", "Two-handed critical"]] : [])];
  m.innerHTML = `<div class="tiny muted" style="padding:2px 8px 4px">${esc(spec.title)}</div>${items.map(([v, l]) => `<button role="menuitem" data-v="${v}">${l}</button>`).join("")}
    <div class="rsw"><span class="tiny muted">Dice</span>${Object.entries(Dice.PALETTES).map(([k, p]) => `<button class="sw${Dice.palette === k ? " on" : ""}" data-pal="${k}" title="${p.name}" aria-label="${p.name} dice" style="background:${p.body};color:${p.ink}">●</button>`).join("")}</div>`;

  m.addEventListener("click", e => {
    e.stopPropagation();
    const pal = e.target.closest("[data-pal]");
    if (pal) { Dice.setPalette(pal.dataset.pal); m.querySelectorAll(".sw").forEach(s => s.classList.toggle("on", s === pal)); return; }
    const it = e.target.closest("[data-v]"); if (!it) return;
    const v = it.dataset.v;
    if (spec.d20) doRoll(spec, v); else doRoll(rollSpec(el, { crit: v.includes("crit"), versatile: v.includes("vers") }));

Object.assign(ACT, {
  roll(el) { if (ROLL.press && ROLL.press.fired && ROLL.press.el === el) { ROLL.press = null; return; } doRoll(rollSpec(el)); },
  rolldmg(el) { doRoll(rollSpec({ dataset: { r: "dmg", k: el.dataset.k } }, { crit: !!el.dataset.crit })); },
  rollclose() { $("#rollCard").classList.remove("on"); Dice.clear(); ROLL.last = null; }
});
// hold to open the roll menu (right-click on a computer)
document.addEventListener("pointerdown", e => {
  if (ROLL.menu && !e.target.closest(".rmenu")) closeRollMenu();
  const el = e.target.closest('[data-a="roll"]'); if (!el || e.button > 0) return;
  const p = ROLL.press = { el, x: e.clientX, y: e.clientY, fired: false, t: setTimeout(() => { p.fired = true; rollMenu(el); }, 450) };
});
document.addEventListener("pointermove", e => { const p = ROLL.press; if (p && !p.fired && Math.hypot(e.clientX - p.x, e.clientY - p.y) > 10) { clearTimeout(p.t); ROLL.press = null; } });
["pointerup", "pointercancel"].forEach(t => document.addEventListener(t, () => { const p = ROLL.press; if (p && !p.fired) { clearTimeout(p.t); ROLL.press = null; } }));

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;

document.addEventListener("change", e => {

  if (el.matches("input[type=checkbox][data-a]")) { const f = ACT[el.dataset.a]; f && Promise.resolve(f(el)).catch(fail); return; }
  if (A.view === "build") {

    else if (el.dataset.b) { d[el.dataset.b] = el.value; if (!["name", "player", "appearance"].includes(el.dataset.b)) render(); }

});
