<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ebon Star Companion</title>
<meta name="theme-color" content="#2a68b6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ebon Star">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  /* Sky and gold: pale sky pages, deep navy ink, royal blue and burnished gold accents. Light only, whatever the system setting. */
  --bg: #dbe9f4;
  --surface: #f4f9fd;
  --raised: #ffffff;
  --ink: #142a4c;
  --muted: #4b6584;
  --line: #bcd2e6;
  --gold: #b8862a;
  --gilt: #e0b44a;
  --royal: #1d4f91;
  --royal-2: #2f6fbf;
  --accent: #1f5ca8;
  --accent-ink: #ffffff;
  --accent-soft: #fbefc8;
  --active: #fff4d3;
  --good: #2e7a3a;
  --warn: #a06200;
  --bad: #b02a1f;
  --pc: #1f5ca8;
  --npc: #6a3f9a;
  --mon: #a3301f;
  --r-common: #5f6b7c;
  --r-uncommon: #2e7a3a;
  --r-rare: #1f5ca8;
  --r-veryrare: #7038a0;
  --r-legendary: #b4600a;
  --r-artifact: #b02a1f;
  --display: "Cinzel", "Trajan Pro", "Palatino Linotype", Palatino, Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --book: "Alegreya", "Palatino Linotype", Palatino, Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; padding-bottom: env(safe-area-inset-bottom); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.02rem; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: .86rem; } .tiny { font-size: .76rem; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 96px; }
.wrap.wide { max-width: 1200px; }
header.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding: calc(env(safe-area-inset-top) + 8px) 16px 8px; }
header.top .in { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 40px; }
header.top .title { flex: 1; min-width: 0; }
header.top .title h1 { font-size: 1.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.top .title .sub { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; }
.card > h2:first-child, .card > h3:first-child { margin-bottom: 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.nw { flex-wrap: nowrap; } .grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 8px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 14px; min-height: 40px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: .9rem; }
.btn.icon { width: 40px; padding: 0; display: inline-grid; place-items: center; font-size: 1.3rem; line-height: 1; }
header .btn.icon { font-size: 1.7rem; }
.btn:disabled { opacity: .45; cursor: default; }
input[type=text], input[type=number], input:not([type]), select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 40px; width: 100%; }
textarea { min-height: 90px; resize: vertical; }
label.f { display: block; } label.f > span { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 3px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); font-size: .8rem; }
.pill.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.src { font-size: .68rem; font-weight: 600; padding: 0 5px; border-radius: 4px; background: var(--accent-soft); color: var(--muted); vertical-align: 1px; }
.pill.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin: 12px -16px 0; padding: 0 16px; position: sticky; top: calc(env(safe-area-inset-top) + 57px); background: var(--bg); z-index: 10; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; padding: 10px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.stat { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px; text-align: center; }
.stat .v { font-family: var(--mono); font-size: 1.35rem; font-weight: 600; }
.stat .k { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.abils { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.abil { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; }
.abil .n { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.abil .m { font-family: var(--mono); font-size: 1.4rem; font-weight: 600; }
.abil .s { font-family: var(--mono); font-size: .82rem; color: var(--muted); }
.abil .sv { margin-top: 4px; font-size: .78rem; border-top: 1px solid var(--line); padding-top: 4px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); vertical-align: middle; }
.dot.on { background: var(--accent); border-color: var(--accent); }
.dot.ex { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 2px var(--raised), 0 0 0 3.5px var(--accent); }
.list > .li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.list > .li:first-child { border-top: 0; }
.skill .mod { font-family: var(--mono); width: 3.2em; text-align: right; }
.hpbar { height: 8px; border-radius: 6px; background: var(--line); overflow: hidden; display: flex; }
.hpbar i { display: block; background: var(--good); } .hpbar i.t { background: var(--pc); }
.hpbar.low i:first-child { background: var(--warn); } .hpbar.crit i:first-child { background: var(--bad); }
.hpbig { font-family: var(--mono); font-size: 2rem; font-weight: 600; }
.pips { display: inline-flex; gap: 5px; flex-wrap: wrap; }
.pip { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--accent); background: var(--accent); cursor: pointer; padding: 0; }
.pip.used { background: transparent; border-color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: .9rem; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip:disabled { opacity: .4; cursor: default; }
.feat { padding: 10px 0; border-top: 1px solid var(--line); }
.feat:first-of-type { border-top: 0; }
.feat .h { display: flex; gap: 8px; align-items: baseline; }
.feat .h b { flex: 1; }
.feat p { margin: 4px 0 0; font-size: .93rem; color: var(--muted); white-space: pre-wrap; }
.rar { font-size: .78rem; font-weight: 600; text-transform: capitalize; }
.rar.common { color: var(--r-common); } .rar.uncommon { color: var(--r-uncommon); } .rar.rare { color: var(--r-rare); } .rar.veryrare { color: var(--r-veryrare); } .rar.legendary { color: var(--r-legendary); } .rar.artifact { color: var(--r-artifact); }
.inbox { border: 1.5px solid var(--accent); background: var(--active); }
.grant { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.grant:first-of-type { border-top: 0; }
.steps { display: flex; gap: 4px; margin: 12px 0 4px; }
.steps i { flex: 1; height: 4px; border-radius: 3px; background: var(--line); } .steps i.on { background: var(--accent); }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pick button { text-align: left; border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 10px; cursor: pointer; min-height: 64px; }
.pick button.on { border-color: var(--accent); background: var(--active); box-shadow: inset 0 0 0 1px var(--accent); }
.pick button b { display: block; font-family: var(--display); }
.pick button span { font-size: .8rem; color: var(--muted); }
.party { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.pc { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; text-align: left; width: 100%; }
.pc:hover { border-color: var(--accent); }
.pc .nm { font-family: var(--display); font-weight: 700; font-size: 1.1rem; }
.pc .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; text-align: center; }
.pc .meta div { background: var(--surface); border-radius: 8px; padding: 4px; }
.pc .meta b { display: block; font-family: var(--mono); }
.pc .meta span { font-size: .7rem; color: var(--muted); text-transform: uppercase; }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: 0 0 0 0 transparent; } }
.code { font-family: var(--mono); font-size: 1.6rem; letter-spacing: .2em; font-weight: 600; color: var(--accent); }
.banner { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; font-size: .88rem; margin-top: 12px; }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--raised); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); }
dialog::backdrop { background: rgb(0 0 0 / .5); }
dialog .dh { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--raised); z-index: 1; }
dialog .dh h2 { flex: 1; }
dialog .db { padding: 14px; }
dialog .df { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 14px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--raised); }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 100; max-width: calc(100vw - 32px); opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.on { opacity: 1; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.sec-title { display: flex; align-items: center; gap: 8px; margin: 20px 0 4px; }
.sec-title h2 { flex: 1; }
.recap p { margin: 6px 0; } .recap ul { margin: 6px 0; padding-left: 20px; } .recap h4 { margin: 10px 0 4px; }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, 1fr); } .grid3 { grid-template-columns: 1fr 1fr; } }

/* ---- sky and gold theme ---- */
body { background-color: var(--bg); background-image: radial-gradient(ellipse 60% 40% at 15% 8%, rgb(255 255 255 / .65), transparent 70%), radial-gradient(ellipse 50% 35% at 85% 20%, rgb(255 255 255 / .5), transparent 70%), radial-gradient(ellipse 120% 60% at 50% 110%, rgb(224 180 74 / .18), transparent 70%), linear-gradient(#cfe3f3, #e8f2fa 55%, #eef3ef); background-attachment: fixed; }
h1, h2, h3 { font-weight: 600; letter-spacing: .03em; }
::selection { background: #f6dc8e; color: var(--ink); }
:root { accent-color: var(--accent); }
.btn.primary { background: linear-gradient(var(--royal-2), var(--royal)); border-color: var(--gold); color: #fff; box-shadow: inset 0 1px 0 rgb(255 255 255 / .25), 0 1px 3px rgb(20 42 76 / .3); text-shadow: 0 1px 0 rgb(0 0 0 / .25); }
.btn.primary:hover { filter: brightness(1.1); }
a.btn { color: var(--ink); }
.toast, #toast { background: #142a4c; color: #fff; border: 1px solid var(--gilt); }
.toast .btn { color: #fff; border-color: #fff; }
dialog::backdrop { background: rgb(10 30 60 / .45); }
input[type=text], input[type=number], input:not([type]), select, textarea { box-shadow: inset 0 1px 2px rgb(20 42 76 / .07); }
input:focus, select:focus, textarea:focus { border-color: var(--gilt); outline: none; box-shadow: 0 0 0 3px rgb(224 180 74 / .35); }

header.top { --ink: #ffffff; --muted: #cfe0f4; --line: rgb(255 255 255 / .28); --raised: rgb(255 255 255 / .14); --surface: rgb(255 255 255 / .1); --bg: rgb(10 30 70 / .25); --accent: var(--gilt); --accent-ink: #142a4c; color: #fff; background: linear-gradient(#2a68b6, #1b4a8a); border-bottom: 3px solid var(--gilt); box-shadow: 0 1px 0 #8a6418, 0 4px 14px rgb(20 42 76 / .25); }
header.top .title h1 { color: #fff; text-shadow: 0 1px 0 rgb(0 0 0 / .25); }
header.top .btn.primary { background: linear-gradient(#ffe7a0, #e0b44a); color: #142a4c; border-color: #8a6418; text-shadow: none; }
.card, .stat, .pc { border-color: #bcd2e6; box-shadow: 0 2px 12px rgb(29 79 145 / .09); }
.card { outline: 1px solid rgb(184 134 42 / .35); outline-offset: -5px; }
.card > h2:first-child, .card > h3:first-child, .sec-title h2, .card .row > h2 { color: var(--royal); }
.tabs { background: rgb(219 233 244 / .92); backdrop-filter: blur(4px); }
.tabs button { font-family: var(--display); letter-spacing: .04em; }
.tabs button.on { color: var(--royal); border-bottom: 3px solid var(--gilt); }
.stat .v, .abil .m, .hpbig { color: var(--royal); }
.abil { background: linear-gradient(#ffffff, #eaf3fb); }
.pc .nm, .pick button b { color: var(--royal); }
.pill { background: #fbefc8; }
.banner { background: #e3eefa; border: 1px solid #c6d9ea; }
.inbox { border-color: var(--gilt); }
.dot.on, .dot.ex, .pip { }
.feat p { font-family: var(--book); font-size: 1rem; }
.feat .h b { font-family: var(--book); font-size: 1.05rem; }
.code { color: var(--royal); }
dialog { border-color: var(--gold); background: var(--raised); box-shadow: 0 12px 40px rgb(10 30 60 / .35); }
dialog .dh h2 { color: var(--royal); }
.row > .grow:is(h1, h2, h3) { min-width: min(100%, max-content); }
</style>
</head>
<body>
<header class="top"><div class="in" id="hdr"></div></header>
<main id="app" class="wrap"></main>
<dialog id="dlg"></dialog>
<dialog id="ask"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<footer class="wrap tiny muted" style="padding-bottom:24px;margin-top:-72px">Includes material from the System Reference Document 5.2 by Wizards of the Coast LLC, licensed under <a href="https://creativecommons.org/licenses/by/4.0/legalcode" style="color:inherit">CC-BY-4.0</a>.</footer>

<script src="config.js"></script>
<script src="srd.js"></script>
<script src="engine.js"></script>
<script src="backend.js"></script>
<script>
"use strict";
const { ABILS, ABIL_NAME, SKILLS, ALL_SKILLS, SPECIES, FEATS, BACKGROUNDS, CLASSES, ARMOR, WEAPONS, CONDITIONS, STANDARD_ARRAY, POINT_COST } = SRD;
const E = Engine;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sg = E.sign;
const RK = r => String(r || "").replace(/\s/g, "").toLowerCase();
// Lineages, origin feats, subclasses and spells grow when the DM turns on books in the content library.
const { LINEAGES, LINEAGE_LABEL, ORIGIN_FEATS, SPELLS, SOURCE } = SRD;
const srcTag = (kind, name) => SOURCE[kind + ":" + name] ? ` <span class="src">${esc(SOURCE[kind + ":" + name])}</span>` : "";

const A = { be: null, user: null, camps: [], camp: null, chars: [], grants: [], members: [], homebrew: [], content: [], contentOk: true, view: "home", charId: null, tab: "main", draft: null, step: 0, unsub: null, seenGrants: new Set(), pendingRender: false, editSkills: false, sessions: [], notes: [], privateRecaps: [], notesOk: true, noteSess: null, noteDraft: "", notesBack: "camp", liveSeen: null };

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2600); }
function fail(e) { console.error(e); toast(e.message || String(e)); }
const isDM = () => A.camp && A.camp.role === "dm";
const charRow = id => A.chars.find(c => c.id === id);
const memberName = uid => (A.members.find(m => m.user_id === uid) || {}).display_name || "";

// ---------- boot ----------
// Running inside the DM Suite's Players tab (desktop app): the Suite does the talking to Supabase.
const SUITE = /(^|[#&])suite\b/.test(location.hash.slice(1)) && window.parent !== window;
const PUBLIC_URL = "https://xakified.github.io/ebon-star-companion/";
async function copyText(text, done) {
  try { if (SUITE) await A.be.copy(text); else await navigator.clipboard.writeText(text); toast(done); return true; } catch (e) { return false; }
}
async function boot() {
  try {
    const cfg = window.APP_CONFIG || {};
    if (!SUITE && cfg.supabaseUrl && cfg.supabaseAnonKey && !/[?&]demo\b/.test(location.search)) await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.js");
    A.be = makeBackend();
    A.user = await A.be.init();
    A.camps = await A.be.myCampaigns();
    if (SUITE) { if (A.camps[0]) { await openCamp(A.camps[0].id); A.view = "camp"; } else A.view = "unlinked"; render(); return; }
    const last = localStorage.getItem("esc-camp-" + A.be.mode);
    const hash = new URLSearchParams(location.hash.slice(1));
    if (hash.get("join")) { A.view = "home"; A.prefillCode = hash.get("join"); }
    else if (last && A.camps.some(c => c.id === last)) await openCamp(last);
    render();
  } catch (e) { $("#app").innerHTML = `<div class="card"><h2>Couldn't start</h2><p>${esc(e.message)}</p><p class="muted small">Add <span class="num">?demo</span> to the address to try demo mode.</p></div>`; }
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("Couldn't load " + src)); document.head.appendChild(s); }); }

async function openCamp(id) {
  A.camp = A.camps.find(c => c.id === id);
  localStorage.setItem("esc-camp-" + A.be.mode, id);
  await Promise.all([refresh(), refreshContent()]);
  A.grants.filter(g => g.status === "pending").forEach(g => A.seenGrants.add(g.id));
  A.liveSeen = (liveSession() || {}).id || "";
  if (A.unsub) A.unsub();
  A.unsub = A.be.subscribe(id, onLive);
  A.view = "camp";
  if (!isDM()) { const mine = A.chars.filter(c => c.owner === A.user); if (mine.length === 1) { A.view = "sheet"; A.charId = mine[0].id; } }
}
async function refresh() {
  if (!A.camp) return;
  [A.chars, A.grants, A.members] = await Promise.all([A.be.listCharacters(A.camp.id), A.be.listGrants(A.camp.id), A.be.members(A.camp.id)]);
  if (isDM()) A.homebrew = await A.be.listHomebrew(A.camp.id);
  else await refreshNotes();
}
// Session notes need supabase/fix-04-session-notes.sql; without it the rest of the app works as before.
async function refreshNotes() {
  try { [A.sessions, A.notes] = await Promise.all([A.be.listSessions(A.camp.id), A.be.listNotes(A.camp.id)]); A.notesOk = true; }
  catch (e) { console.warn(e); A.sessions = []; A.notes = []; A.notesOk = false; }
  try { A.privateRecaps = A.notesOk ? await A.be.listPrivateRecaps(A.camp.id) : []; } catch (e) { A.privateRecaps = []; } // needs fix-06
}
// The content library (supabase/fix-07-content-library.sql). Without it the builder uses the SRD only.
async function refreshContent() {
  try { A.content = A.camp ? await A.be.listContent(A.camp.id) : []; A.contentOk = true; }
  catch (e) { console.warn(e); A.content = []; A.contentOk = false; }
  E.useContent(A.content);
}
const liveSession = () => A.sessions.find(x => x.live) || null;
let liveTimer = null;
let contentChanged = false;
function onLive(ev) {
  if (ev.table === "content_packs") contentChanged = true;
  clearTimeout(liveTimer);
  liveTimer = setTimeout(async () => {
    if (contentChanged) { contentChanged = false; await refreshContent(); }
    await refresh().catch(fail);
    const fresh = A.grants.filter(g => g.status === "pending" && !A.seenGrants.has(g.id));
    fresh.forEach(g => A.seenGrants.add(g.id));
    if (fresh.length && !isDM()) { toast("The DM sent you " + fresh.map(E.grantLabel).join(", ")); navigator.vibrate && navigator.vibrate(120); }
    else if (!isDM()) { const l = liveSession(); if (l && A.liveSeen !== null && A.liveSeen !== l.id) toast(`${l.title || "The session"} has started. Tap Session notes to jot things down.`); }
    if (!isDM()) A.liveSeen = (liveSession() || {}).id || "";
    A.flashId = ev.table === "characters" ? ev.id : null;
    softRender();
  }, 150);
}
// Don't redraw under someone's thumb while they're typing.
function softRender() {
  const f = document.activeElement;
  if (f && f.closest("#app, #dlg") && /INPUT|TEXTAREA|SELECT/.test(f.tagName)) { A.pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", () => setTimeout(() => { if (A.pendingRender) { A.pendingRender = false; softRender(); } }, 50));

// Save a change to a character: show it right away, then write it with a version check.
async function edit(id, fn) {
  const row = charRow(id); if (!row) return;
  fn(row.data); render();
  try { const r = await updateCharacter(A.be, id, fn); row.data = r.data; row.version = r.version; }
  catch (e) { fail(e); await refresh(); render(); }
}

// ---------- header ----------
function header() {
  const h = $("#hdr");
  let back = "", title = "Ebon Star Companion", sub = A.be && A.be.mode === "demo" ? "Demo mode: data stays in this browser" : "", right = "";
  if (A.view === "camp" && A.camp) { back = SUITE ? "" : `<button class="btn icon ghost" data-a="home" aria-label="Campaigns">‹</button>`; title = A.camp.name; sub = isDM() ? "Dungeon Master" : "Player"; }
  if (A.view === "sheet") { const r = charRow(A.charId); back = `<button class="btn icon ghost" data-a="camp" aria-label="Back">‹</button>`; title = r ? r.data.name || "Unnamed" : ""; if (r) { const d = r.data; sub = `${d.species} ${d.cls} ${d.level}${d.subclass ? " · " + d.subclass : ""}${isDM() ? " · " + (memberName(r.owner) || "player") : ""}`; } if (isDM()) right = `<button class="btn sm primary" data-a="send" data-id="${A.charId}">Send</button>`; }
  if (A.view === "build") { back = `<button class="btn icon ghost" data-a="camp" aria-label="Cancel">‹</button>`; title = "New character"; sub = A.camp ? A.camp.name : ""; }
  if (A.view === "camp" && isDM()) right = `<button class="btn sm primary" data-a="send">Send</button>`;
  if ((A.view === "camp" || A.view === "sheet") && A.camp && !isDM() && A.notesOk) right = `<button class="btn sm ${liveSession() ? "primary" : ""}" data-a="notes" title="Recaps of past sessions, and notes for your DM">Sessions${liveSession() ? " ●" : ""}</button>`;
  if (A.view === "notes") { back = `<button class="btn icon ghost" data-a="notesback" aria-label="Back">‹</button>`; title = "Sessions"; sub = A.camp ? A.camp.name : ""; }
  h.innerHTML = `${back}<div class="title"><h1>${esc(title)}</h1>${sub ? `<div class="sub">${esc(sub)}</div>` : ""}</div>${right}`;
}

function render() {
  header();
  $("#app").className = "wrap" + (A.view === "camp" && isDM() ? " wide" : "");
  const v = { unlinked: vUnlinked, home: vHome, camp: vCamp, build: vBuild, sheet: vSheet, notes: vNotes }[A.view] || vHome;
  $("#app").innerHTML = v();
  if (A.flashId) { const el = document.querySelector(`[data-pc="${A.flashId}"]`); if (el) el.classList.add("flash"); A.flashId = null; }
}

// ---------- campaign ----------
function hpOf(d) { const x = E.derive(d); const cur = d.hp.cur ?? x.hpMax; return { cur, max: x.hpMax, temp: d.hp.temp || 0, x }; }
function hpBar(h) { const tot = Math.max(h.max, h.cur + h.temp); const p = Math.max(0, h.cur) / tot * 100, t = h.temp / tot * 100; const cls = h.cur <= 0 || h.cur / h.max < .25 ? "crit" : h.cur / h.max < .5 ? "low" : ""; return `<div class="hpbar ${cls}"><i style="width:${p}%"></i><i class="t" style="width:${t}%"></i></div>`; }

function vCamp() {
  const pend = id => A.grants.filter(g => g.character_id === id && g.status === "pending").length;

      return `<button class="pc" data-a="sheet" data-id="${r.id}" data-pc="${r.id}">
        <div class="row nw"><div class="grow"><div class="nm">${esc(d.name || "Unnamed")}</div><div class="small muted">${esc(d.species)} ${esc(d.cls)} ${d.level} · ${esc(memberName(r.owner) || "player")}</div></div>${pend(r.id) ? `<span class="pill">${pend(r.id)} pending</span>` : ""}</div>
        <div class="row nw" style="margin-top:8px"><span class="num small">${h.cur}/${h.max}${h.temp ? " +" + h.temp : ""}</span><div class="grow">${hpBar(h)}</div></div>
        <div class="meta"><div><b>${h.x.ac}</b><span>AC</span></div><div><b>${h.x.passive}</b><span>Passive Perc</span></div><div><b>${sg(h.x.init)}</b><span>Init</span></div></div>
        ${tags.length ? `<div class="chips" style="margin-top:8px">${tags.map(t => `<span class="pill bad">${esc(t)}</span>`).join("")}</div>` : ""}

    const recent = A.grants.slice(0, 12).map(g => { const r = charRow(g.character_id); return `<div class="grant"><div class="grow"><b>${esc(E.grantLabel(g))}</b> <span class="muted small">to ${esc(r ? r.data.name : "?")}</span></div><span class="pill ${g.status === "accepted" ? "good" : g.status === "declined" ? "bad" : ""}">${g.status}</span></div>`; }).join("");
    return `
      <div class="card row"><div class="grow"><div class="small muted">Players join with this code</div><div class="code">${esc(A.camp.join_code)}</div></div><button class="btn sm" data-a="copylink">Copy invite link</button></div>
      ${SUITE ? `<div class="card row"><div class="grow"><b>Other DM devices</b><div class="small muted">Make a one-time code to be the DM on another computer's DM Suite, or in the Companion on a phone or browser.</div></div><button class="btn sm" data-a="suitecode">Make DM code</button></div>` : `<div class="card row"><div class="grow"><b>DM Suite and other devices</b><div class="small muted">Bring these characters into your DM Suite's party list and initiative tracker, with HP and conditions synced both ways. The same code makes another phone or browser a DM of this campaign.</div></div><button class="btn sm" data-a="suitecode">Make DM code</button></div>`}
      <div class="sec-title"><h2>Party</h2><span class="small muted">${A.chars.length} character${A.chars.length === 1 ? "" : "s"} · live</span></div>
      ${A.chars.length ? `<div class="party">${cards}</div>` : `<div class="card empty">No characters yet. When players join and build characters, they'll appear here.</div>`}
      <div class="card"><div class="row"><h2 class="grow">Who's in the campaign</h2><span class="small muted">${A.members.filter(m => m.role === "player").length} player${A.members.filter(m => m.role === "player").length === 1 ? "" : "s"}</span></div>
        <div class="list">${A.members.filter(m => m.role === "player").map(m => { const mine = A.chars.filter(c => c.owner === m.user_id); return `<div class="li"><div class="grow"><b>${esc(m.display_name || "Player")}</b>${m.joined_at ? `<span class="small muted"> · joined ${new Date(m.joined_at).toLocaleDateString()}</span>` : ""}</div><span class="small">${mine.length ? mine.map(c => `<button class="btn sm ghost" data-a="sheet" data-id="${c.id}">${esc(c.data.name || "Unnamed")}</button>`).join("") : `<span class="muted">no character yet</span>`}</span></div>`; }).join("") || `<p class="muted small">No players yet. Share the code above.</p>`}</div>

        <div class="card"><h2>Recently sent</h2>${recent || `<p class="muted small">Nothing sent yet. Use Send to give a player an item, a custom skill, a spell, coins or XP.</p>`}</div>

    ${mine.length ? "" : `<div class="card empty">You don't have a character in this campaign yet.</div>`}
    ${A.notesOk && liveSession() ? `<div class="banner row"><span class="grow"><b>${esc(liveSession().title || "A session")}</b> is being played now. Write down what you notice, suspect or plan.</span><button class="btn sm primary" data-a="notes">Add a note</button></div>` : ""}
    <button class="btn primary" style="margin-top:12px;width:100%" data-a="build">Create a character</button>`;
}

}

// The content library: books the DM has added. Players see what's turned on in their character builder.
function bookList() {
  if (!A.contentOk) return `<p class="muted small">To share options from your own books with your players' character builder, run <b>supabase/fix-07-content-library.sql</b> once in the Supabase SQL Editor.</p>`;
  const rows = A.content.map(b => `<div class="li"><div class="grow"><b>${esc(b.name)}</b>${b.abbr ? ` <span class="src">${esc(b.abbr)}</span>` : ""}<div class="small muted">${esc(b.summary || (() => { try { return E.checkContent(b.data); } catch (e) { return ""; } })())}</div></div>
    <label class="row small" style="gap:6px"><input type="checkbox" data-a="togglebook" data-id="${b.id}" ${b.enabled !== false ? "checked" : ""}> Players can use</label>
    <button class="btn sm ghost danger" data-a="delbook" data-id="${b.id}" aria-label="Remove ${esc(b.name)}">✕</button></div>`).join("");
  return `<p class="muted small" style="margin-top:0">Species, backgrounds, feats, classes, subclasses and spells from books you own, for your players' character builder. Only people in this campaign can see them.</p>${rows ? `<div class="list">${rows}</div>` : `<p class="small muted">No books yet. Add a book file (.json) made from your PDFs.</p>`}`;
}
// Characters using a class, species, background or subclass from this book.
function bookUsers(b) {
  const d0 = b.data || {}, has = (o, k) => !!k && Object.prototype.hasOwnProperty.call(o || {}, k);
  return A.chars.filter(r => { const d = r.data; return has(d0.classes, d.cls) || has(d0.species, d.species) || has(d0.backgrounds, d.background) || ((d0.subclasses || {})[d.cls] || []).some(x => x.name === d.subclass); }).map(r => r.data.name || "Unnamed");
}
async function addBooks(files) {
  let n = 0;
  for (const f of files) {
    if (f.size > 4e6) throw new Error(`${f.name} is too big (4 MB at most).`);
    let d; try { d = JSON.parse(await f.text()); } catch (e) { throw new Error(`${f.name} isn't a book file.`); }
    const summary = E.checkContent(d);
    const old = A.content.find(b => b.name === d.name);
    await A.be.saveContent(A.camp.id, { name: String(d.name).slice(0, 200), abbr: String(d.abbr || "").slice(0, 20), data: d, enabled: old ? old.enabled !== false : true }, old && old.id);
    n++; toast(`${old ? "Updated" : "Added"} ${d.name}: ${summary}`);
  }
  if (n) { await refreshContent(); render(); }
}

// ---------- builder ----------
const STEPS = ["Class", "Background", "Species", "Abilities", "Skills", "Finish"];
function newDraft() {
  const d = E.blank();
  d.player = localStorage.getItem("esc-name") || "";
  Object.assign(d, { abilAssign: {}, bgMode: "21", bg2: "", bg1: "", classSkills: [], extraSkills: [], originFeat2: "" });
  return d;
}
function vBuild() {

  const books = A.content.filter(b => b.enabled !== false).map(b => b.name);
  const bookNote = books.length ? `<p class="small muted">Includes options from your DM's books: ${esc(books.join(", "))}.</p>` : "";
  if (s === 0) body = `<h2>Choose a class</h2>${bookNote}<div class="pick" style="margin-top:10px">${Object.entries(CLASSES).map(([k, c]) => `<button class="${d.cls === k ? "on" : ""}" data-a="bset" data-k="cls" data-v="${esc(k)}"><b>${esc(k)}${srcTag("class", k)}</b><span>d${c.hd} · ${esc(c.primary)}</span></button>`).join("")}</div>
      ${CLASSES[d.cls] ? `<div class="card small"><b>${esc(d.cls)}</b><div class="muted">Saves: ${CLASSES[d.cls].saves.map(a => ABIL_NAME[a]).join(", ")} · Armor: ${esc(CLASSES[d.cls].armor)} · Weapons: ${esc(CLASSES[d.cls].weapons)}</div><div style="margin-top:6px">${(CLASSES[d.cls].f || []).filter(f => f[0] === 1).map(f => `<div><b>${esc(f[1])}.</b> <span class="muted">${esc(f[2])}</span></div>`).join("")}</div></div>` : ""}`;
  if (s === 1) {
    const b = BACKGROUNDS[d.background];
    body = `<h2>Choose a background</h2><div class="pick" style="margin-top:10px">${Object.entries(BACKGROUNDS).map(([k, x]) => `<button class="${d.background === k ? "on" : ""}" data-a="bset" data-k="background" data-v="${esc(k)}"><b>${esc(k)}${srcTag("background", k)}</b><span>${esc(x.skills.join(", "))} · ${esc(x.feat)}</span></button>`).join("")}</div>
      ${b ? `<div class="card stack"><div class="small">Skills: <b>${esc(b.skills.join(", "))}</b> · Tool: <b>${esc(b.tool)}</b> · Feat: <b>${esc(b.feat)}${b.featNote ? " (" + esc(b.featNote) + ")" : ""}</b></div>${FEATS[b.feat] ? `<div class="small muted">${esc(FEATS[b.feat])}</div>` : ""}
        <div><div class="small muted">Ability increases (choose from ${b.abil.map(a => ABIL_NAME[a]).join(", ")})</div>
        <div class="chips" style="margin:6px 0"><button class="chip ${d.bgMode === "21" ? "on" : ""}" data-a="bset" data-k="bgMode" data-v="21">+2 and +1</button><button class="chip ${d.bgMode === "111" ? "on" : ""}" data-a="bset" data-k="bgMode" data-v="111">+1 to all three</button></div>
        ${d.bgMode === "21" ? `<div class="grid2"><label class="f"><span>+2 to</span><select data-b="bg2">${opt(b.abil, d.bg2, a => ABIL_NAME[a])}</select></label><label class="f"><span>+1 to</span><select data-b="bg1">${opt(b.abil.filter(a => a !== d.bg2), d.bg1, a => ABIL_NAME[a])}</select></label></div>` : ""}</div></div>` : ""}
      <p class="small muted">Your DM may have a custom background for you. Pick the closest one; they can send you features later.</p>`;
  }
  if (s === 2) {
    const sp = SPECIES[d.species];
    body = `<h2>Choose a species</h2><div class="pick" style="margin-top:10px">${Object.entries(SPECIES).map(([k, x]) => `<button class="${d.species === k ? "on" : ""}" data-a="bset" data-k="species" data-v="${esc(k)}"><b>${esc(k)}${srcTag("species", k)}</b><span>${esc(x.size)} · ${x.speed} ft</span></button>`).join("")}</div>
      ${sp ? `<div class="card stack">${LINEAGES[d.species] ? `<label class="f"><span>${esc(LINEAGE_LABEL[d.species] || "Lineage")}</span><select data-b="lineage"><option value="">Choose…</option>${opt(LINEAGES[d.species], d.lineage)}</select></label>` : ""}
        ${d.species === "Human" ? `<label class="f"><span>Versatile: extra Origin feat</span><select data-b="originFeat2"><option value="">Choose…</option>${opt(ORIGIN_FEATS, d.originFeat2)}</select></label>` : ""}
        ${sp.traits.map(t => `<div class="small"><b>${esc(t[0])}.</b> <span class="muted">${esc(t[1])}</span></div>`).join("")}</div>` : ""}`;
  }
  if (s === 3) body = abilStep(d);

      <label class="f"><span>Character name</span><input data-b="name" value="${esc(d.name)}" placeholder="e.g. Orifina"></label>
      <label class="f"><span>Player</span><input data-b="player" value="${esc(d.player)}"></label>
      <label class="f"><span>Appearance and personality (optional)</span><textarea data-b="appearance">${esc(d.appearance)}</textarea></label></div>
      <div class="card small"><b>Starting gear:</b> you start with ${c.gold} gp from your class and 50 gp from your background (${c.gold + 50} gp). Add weapons, armor and gear on the Gear tab of your sheet, or use your DM's starting packages.</div>

  }
  const can = stepOk(d, s);
  return `<div class="steps">${STEPS.map((x, i) => `<i class="${i <= s ? "on" : ""}"></i>`).join("")}</div><div class="small muted">Step ${s + 1} of ${STEPS.length}: ${STEPS[s]}</div>
    <div style="margin-top:10px">${body}</div>
    <div class="row" style="margin-top:16px"><button class="btn" data-a="bprev" ${s ? "" : "disabled"}>Back</button><span class="grow small muted" style="text-align:center">${can === true ? "" : esc(can)}</span>${s < STEPS.length - 1 ? `<button class="btn primary" data-a="bnext" ${can === true ? "" : "disabled"}>Next</button>` : `<button class="btn primary" data-a="bdone" ${can === true ? "" : "disabled"}>Create character</button>`}</div>`;
}
function opt(list, cur, lab = x => x) { return list.map(v => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(lab(v))}</option>`).join(""); }
function pointsUsed(d) { return ABILS.reduce((s, a) => s + (POINT_COST[d.base[a]] ?? 99), 0); }
function abilStep(d) {
  const m = d.abilMethod, c = CLASSES[d.cls];
  let rows = "";

// ---------- session notes (players) ----------
function noteTime(t) { const d = new Date(t); return isNaN(d) ? "" : d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); }
function sessLabel(x) { return `${x.title || "Session"}${x.played_on ? " · " + new Date(x.played_on + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" }) : ""}${x.live ? " · playing now" : ""}`; }
// Recaps come from the DM Suite as Markdown with [[Lore links]]: show headings, bullets, bold and italics, drop the links' brackets.
function miniMd(t) {
  const inl = x => esc(x.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, a, b) => b || a)).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  let out = "", list = false;
  for (const raw of String(t || "").replace(/\r/g, "").split("\n")) {
    const l = raw.trim(), li = l.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/), h = l.match(/^#{1,6}\s+(.*)$/);
    if (li) { if (!list) { out += "<ul>"; list = true; } out += `<li>${inl(li[1])}</li>`; continue; }
    if (list) { out += "</ul>"; list = false; }
    if (h) out += `<h4>${inl(h[1])}</h4>`; else if (l) out += `<p>${inl(l)}</p>`;
  }
  return out + (list ? "</ul>" : "");
}
function noteRow(n, x, other) {
  const meta = [noteTime(n.created_at), other ? (n.character_name ? `${n.character_name}${n.author_name ? " (" + n.author_name + ")" : ""}` : n.author_name || "A player") : n.character_name,
    x.ended_at && n.created_at > x.ended_at ? "added after the session" : "", n.updated_at && Date.parse(n.updated_at) - Date.parse(n.created_at) > 60000 ? "edited" : ""].filter(Boolean).join(" · ");
  return `<div class="li" style="align-items:flex-start"><div class="grow"><div class="tiny muted">${esc(meta)}</div><div style="white-space:pre-wrap">${esc(n.body)}</div></div>${other ? "" : `<button class="btn sm ghost" data-a="editnote" data-id="${n.id}" aria-label="Edit">✎</button><button class="btn sm ghost danger" data-a="delnote" data-id="${n.id}" aria-label="Delete">✕</button>`}</div>`;
}

// ---------- DM Suite import ----------
async function importSuiteLibrary() {
  const items = (await A.be.suiteItems()).filter(x => x && x.name);
  if (!items.length) return toast("Your item library is empty. Save magic items on the Table tab first.");
  const have = new Set(A.homebrew.filter(h => h.kind === "item").map(h => h.data.name));
  let n = 0;
  for (const x of items) { const it = E.fromSuiteItem(x); if (have.has(it.name)) continue; await A.be.saveHomebrew(A.camp.id, "item", it); have.add(it.name); n++; }
  A.homebrew = await A.be.listHomebrew(A.camp.id); render();
  toast(n ? `Imported ${n} item${n > 1 ? "s" : ""}` : "Those items are already in your library");
}
async function importSuite(file) {
  const text = await file.text();
  let j; try { j = JSON.parse(text); } catch (e) { throw new Error("That file isn't a DM Suite campaign or JSON export."); }
  let items = [];
  if (j.format === "ebon-dm-campaign") { items = Object.values(j.items || {}); if (j.table && Array.isArray(j.table.library)) items = items.concat(j.table.library); }
  else if (Array.isArray(j)) items = j; else if (j.items) items = Array.isArray(j.items) ? j.items : Object.values(j.items); else if (j.library) items = j.library;
  items = items.filter(x => x && x.name);
  if (!items.length) throw new Error("No magic items found in that file. Save some in the DM Suite's item library first.");
  const have = new Set(A.homebrew.filter(h => h.kind === "item").map(h => h.data.name));
  let n = 0;
  for (const x of items) { const it = E.fromSuiteItem(x); if (have.has(it.name)) continue; await A.be.saveHomebrew(A.camp.id, "item", it); n++; }
  A.homebrew = await A.be.listHomebrew(A.camp.id); render();
  toast(n ? `Imported ${n} item${n > 1 ? "s" : ""}` : "Those items are already in your library");
}

const ACT = {

  camp() { A.view = "camp"; render(); },

    const code = await A.be.createDmInvite(A.camp.id);
    dialog("DM code", `<div class="stack">
      <p style="margin:0">In the DM Suite desktop app, choose <b>Companion &gt; Connect to Companion…</b> and paste this code. Or, to be the DM in this app on another phone or browser, paste it into <b>Join a campaign</b> there. It works once and expires in 30 minutes.</p>
      <textarea id="suiteCode" readonly class="num small" style="min-height:110px;word-break:break-all">${esc(code)}</textarea>
      <p class="small muted" style="margin:0">Keep it to yourself: whoever uses it becomes a DM of this campaign.</p></div>`,
      `<button class="btn" data-a="close">Done</button><button class="btn primary" data-a="copysuite">Copy code</button>`);
  },
  copysuite() { const t = $("#suiteCode"); t.select(); if (SUITE) return copyText(t.value, "Code copied"); (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => toast("Code copied"), () => { document.execCommand && document.execCommand("copy"); toast("Code selected: copy it with Ctrl+C"); }); },
  close() { closeDlg(); },
  // session notes
  notes() { if (A.view !== "notes") A.notesBack = A.view; A.view = "notes"; render(); scrollTo(0, 0); },
  notesback() { A.view = A.notesBack === "sheet" && charRow(A.charId) ? "sheet" : "camp"; render(); },
  async addnote(el) {
    const body = val("nBody"); if (!body) return toast("Write something first");
    const mine = A.chars.filter(c => c.owner === A.user), ch = mine.find(c => c.id === (val("nChar") || A.charId)) || mine[0];
    const shared = el.dataset.v === "shared";
    const note = { session_id: val("nSess") || A.noteSess, body, character_id: ch ? ch.id : null, character_name: ch ? ch.data.name || "" : "", author_name: memberName(A.user) || localStorage.getItem("esc-name") || "" };
    document.querySelectorAll('[data-a="addnote"]').forEach(b => b.disabled = true);
    try {
      let row;
      try { row = await A.be.addNote(A.camp.id, Object.assign({ visibility: shared ? "shared" : "private" }, note)); }
      catch (e) {
        if (!/visibility/i.test(e.message || "")) throw e;
        if (shared) throw new Error("Party notes aren't switched on yet. Ask your DM to finish setting them up, or save it as private.");
        row = await A.be.addNote(A.camp.id, note); // before fix-06 every note is private
      }
      A.notes.unshift(row); A.noteDraft = ""; render(); toast(shared ? "Saved to party notes" : "Saved. Only you and your DM see it.");
    } finally { document.querySelectorAll('[data-a="addnote"]').forEach(b => b.disabled = false); }
  },
  editnote(el) {
    const n = A.notes.find(x => x.id === el.dataset.id); if (!n) return;
    dialog("Edit note", `<div class="stack"><textarea id="enBody" style="min-height:160px;width:100%">${esc(n.body)}</textarea><label class="row small"><input type="checkbox" id="enShared" ${n.visibility === "shared" ? "checked" : ""}> Party note (everyone in the campaign sees it)</label></div>`, `<button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="savenote" data-id="${n.id}">Save</button>`);
  },
  async savenote(el) {
    const n = A.notes.find(x => x.id === el.dataset.id), body = val("enBody"); if (!n) return closeDlg(); if (!body) return toast("A note can't be empty. Delete it instead.");
    const vis = $("#enShared").checked ? "shared" : "private";
    Object.assign(n, await A.be.updateNote(n.id, body, vis === (n.visibility || "private") ? null : vis) || { body }); closeDlg(); render(); toast("Note updated");
  },
  async delnote(el) {
    const n = A.notes.find(x => x.id === el.dataset.id); if (!n || !await ask({ title: "Delete this note?", text: "It's removed for your DM too.", ok: "Delete", danger: true })) return;
    await A.be.deleteNote(n.id); A.notes = A.notes.filter(x => x !== n); render();
  }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  if (el.tagName === "INPUT" && el.type === "checkbox") return; // handled on change
  const f = ACT[el.dataset.a]; if (!f) return;
  e.preventDefault();
  Promise.resolve(f(el)).catch(fail);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "nSess") { A.noteSess = el.value; return; }
  if (el.matches("input[type=checkbox][data-a]")) { const f = ACT[el.dataset.a]; f && Promise.resolve(f(el)).catch(fail); return; }
  if (A.view === "build") {
    const d = A.draft;
    if (el.dataset.b) { d[el.dataset.b] = el.value; if (!["name", "player", "appearance"].includes(el.dataset.b)) render(); }
    else if (el.dataset.ab) { d.abilAssign[el.dataset.ab] = el.value; render(); }
    else if (el.dataset.raw) { d.base[el.dataset.raw] = Math.max(1, Math.min(30, +el.value || 10)); render(); }
    else if (el.dataset.xs != null) { d.extraSkills[+el.dataset.xs] = el.value; render(); }
    return;
  }
  if (A.view === "sheet") {
    if (el.dataset.coin) edit(A.charId, d => { d.coins[el.dataset.coin] = Math.max(0, +el.value || 0); });
    else if (el.dataset.field) edit(A.charId, d => { d[el.dataset.field] = el.value; });
    else if (el.dataset.numfield) edit(A.charId, d => { d[el.dataset.numfield] = +el.value || 0; });
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "nBody") A.noteDraft = e.target.value;
  if (A.view === "build" && e.target.dataset.b === "name") { A.draft.name = e.target.value; const b = document.querySelector('[data-a="bdone"]'); if (b) b.disabled = !e.target.value.trim(); }
});
$("#dlg").addEventListener("click", e => { if (e.target === $("#dlg")) closeDlg(); });
$("#dlg").addEventListener("change", e => {
  if (e.target.id === "featPick") { const v = e.target.value; const n = $("#featName"), t = $("#featText"); if (v && v !== "__custom") { n.value = v; t.value = FEATS[v] || ""; } else { n.value = ""; t.value = ""; } }
});
try { const t = localStorage.getItem("esc-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
boot();
</script>
</body>
</html>
